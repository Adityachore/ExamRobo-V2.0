services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: examrobo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: examrobo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examrobo -d examrobo"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    build: ./server
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://examrobo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/examrobo
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RECORDINGS_DIR: /data/recordings
      SEB_REQUIRED: ${SEB_REQUIRED:-false}
      SEB_CONFIG_KEY: ${SEB_CONFIG_KEY:-}
      SEB_CONFIG_FILE: /app/assets/exam.seb
      SEB_START_URL: ${SEB_START_URL:-}
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - recordings:/data/recordings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - internal

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      - internal

networks:
  internal:
    internal: true

volumes:
  pgdata:
  redisdata:
  recordings:
