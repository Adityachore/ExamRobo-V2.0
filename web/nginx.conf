map $http_cf_connecting_ip $examrobo_client_ip {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}

map $http_x_forwarded_proto $examrobo_proto {
  default $http_x_forwarded_proto;
  ""      https;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # JSON API payloads only; the screen recorder (and its 8 MB chunks) is gone.
  client_max_body_size 3m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The API sees the real client IP from Cloudflare, so auth lockouts and rate
  # limits are per student rather than per tunnel. Public traffic is always TLS
  # at the Cloudflare edge, so the API must see https for the SEB URL hash.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $examrobo_client_ip;
    proxy_set_header X-Forwarded-For $examrobo_client_ip;
    proxy_set_header X-Forwarded-Proto $examrobo_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # The socket path is exactly /ws (?ticket=...), so match without the trailing
  # slash and keep the connection open.
  location /ws {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $examrobo_client_ip;
    proxy_set_header X-Forwarded-For $examrobo_client_ip;
    proxy_set_header X-Forwarded-Proto $examrobo_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /health {
    proxy_pass http://api:4000/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $examrobo_client_ip;
    proxy_set_header X-Forwarded-Proto $examrobo_proto;
  }

  location / {
    try_files $uri /index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
